name: Publicação Diária - Achados para Casa

on:
  schedule:
    - cron: '0 9,18 * * *' # Executa 2 vezes por dia
  workflow_dispatch: # Permite executar manualmente no botão

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependências
        uses: py-actions/pip-dependency-install@v4
        with:
          submodules: false
          # Como removemos o smtplib nativo e passamos a usar 'requests', vamos garantir que o requests e a biblioteca do Gemini estão instalados:
          
      - name: Instalar pacotes necessários
        run: |
          python -m pip install --upgrade pip
          pip install google-genai requests

      - name: Executar script de postagem de casa
        env:
          BLOGGER_WEB_APP_URL: ${{ secrets.BLOGGER_WEB_APP_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python autoblog_casa.py
