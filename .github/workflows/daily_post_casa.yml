name: Publicação Diária - Achados para Casa

on:
  schedule:
    - cron: '0 10,22 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout do código
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalar dependências
      run: |
        python -m pip install --upgrade pip

    - name: Executar script de postagem de casa
      env:
        BLOG_EMAIL_USER: ${{ secrets.BLOG_EMAIL_USER }}
        BLOG_EMAIL_PASS: ${{ secrets.BLOG_EMAIL_PASS }}
        BLOGGER_PUBLISH_EMAIL: ${{ secrets.BLOGGER_PUBLISH_EMAIL }}
      run: |
        python autoblog_casa.py
