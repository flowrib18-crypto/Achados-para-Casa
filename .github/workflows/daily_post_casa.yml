name: Publicação Diária - Achados para Casa

on:
  schedule:
    - cron: '0 10,22 * * *'  # Roda duas vezes por dia
  workflow_dispatch:        # Permite testar manualmente na aba Actions

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependências
        run: |
          pip install google-generativeai

      - name: Executar script de postagem de casa
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GMAIL_USER: 'seu_email_real@gmail.com'
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          BLOGGER_EMAIL: ${{ secrets.BLOGGER_EMAIL }}
        run: |
          python autoblog_casa.py
